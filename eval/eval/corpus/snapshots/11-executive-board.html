<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Executive Leadership - Holdings Corp</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Victoria Sterling",
    "email": "v.sterling@holdings-corp.com"
  }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #ffffff; margin: 0; padding: 40px; }
    .container { max-width: 650px; margin: 0 auto; }
    h1 { font-size: 24px; color: #1e293b; margin-bottom: 24px; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; }
    .leader-card { display: flex; gap: 24px; padding: 24px; border: 1px solid #e2e8f0; border-radius: 12px; background: #f8fafc; }
    .photo-box { width: 110px; height: 110px; border-radius: 8px; overflow: hidden; border: 2px solid #cbd5e1; flex-shrink: 0; }
    .photo-box img { width: 100%; height: 100%; object-fit: cover; }
    .details h2 { margin: 0 0 6px 0; font-size: 20px; color: #0f172a; }
    .title { color: #64748b; font-size: 14px; margin: 0 0 10px 0; font-weight: 500; }
    .email-link { color: #2563eb; font-size: 13px; text-decoration: none; }
    .bio { font-size: 14px; line-height: 1.5; color: #334155; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Executive Leadership</h1>
    <div class="leader-card" id="ceoCard">
      <div class="photo-box">
        <img id="ceoPhoto" class="exec-avatar" src="../assets/face.svg" data-pii-type="face" alt="Victoria Sterling Portrait Face" width="110" height="110">
      </div>
      <div class="details">
        <h2 id="ceoName" itemprop="name">Victoria Sterling</h2>
        <p class="title">Chief Executive Officer & Chairperson</p>
        <a id="ceoEmail" class="email-link" href="mailto:v.sterling@holdings-corp.com">v.sterling@holdings-corp.com</a>
        <p class="bio">Victoria oversees global capital allocation and corporate privacy architecture across commercial assets.</p>
      </div>
    </div>
  </div>
</body>
</html>
