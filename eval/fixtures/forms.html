<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Checkout & Account Sign-up</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f8fafc; color: #1e293b; padding: 32px 16px; }
    .container { max-width: 860px; margin: 0 auto; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; overflow: hidden; }
    .header { padding: 24px 32px; background: #0f172a; color: #ffffff; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .header .step-badge { background: #334155; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; }
    .stepper { display: flex; border-bottom: 1px solid #e2e8f0; background: #f1f5f9; }
    .step-item { flex: 1; padding: 12px 16px; text-align: center; font-size: 14px; font-weight: 600; color: #64748b; border-bottom: 2px solid transparent; }
    .step-item.active { color: #2563eb; border-bottom-color: #2563eb; background: #ffffff; }
    .step-item.completed { color: #10b981; }
    .content { padding: 32px; }
    .section-title { font-size: 16px; font-weight: 700; color: #0f172a; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid #f1f5f9; }
    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 24px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: span 2; }
    label { font-size: 13px; font-weight: 600; color: #475569; }
    input[type="text"], input[type="email"], input[type="password"], select {
      width: 100%; height: 42px; padding: 8px 14px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background: #ffffff; color: #0f172a;
    }
    input:focus, select:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
    .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .checkbox-group input { width: 18px; height: 18px; cursor: pointer; accent-color: #2563eb; }
    .checkbox-group label { font-size: 14px; font-weight: 400; cursor: pointer; }
    .actions-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 32px; padding-top: 20px; border-top: 1px solid #e2e8f0; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 24px; font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer; border: none; transition: background 0.15s; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-primary { background: #2563eb; color: #ffffff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-social { height: 40px; border: 1px solid #cbd5e1; background: #ffffff; color: #334155; width: 100%; margin-bottom: 12px; }
    .btn-social:hover { background: #f8fafc; }
    .social-divider { text-align: center; margin: 24px 0; position: relative; }
    .social-divider::before { content: ""; position: absolute; left: 0; top: 50%; width: 100%; height: 1px; background: #e2e8f0; }
    .social-divider span { position: relative; background: #ffffff; padding: 0 12px; font-size: 13px; color: #94a3b8; }
    .icon-svg { width: 18px; height: 18px; display: inline-block; vertical-align: middle; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        ApexCommerce Checkout
      </h1>
      <span class="step-badge">Step 2 of 3</span>
    </div>

    <div class="stepper">
      <div class="step-item completed">1. Account</div>
      <div class="step-item active">2. Shipping & Payment</div>
      <div class="step-item">3. Review & Place Order</div>
    </div>

    <div class="content">
      <div class="social-divider"><span>Quick Checkout with Social Login</span></div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <button type="button" class="btn btn-social" id="btn-google">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          </svg>
          Google Pay
        </button>
        <button type="button" class="btn btn-social" id="btn-github">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
          GitHub Account
        </button>
      </div>

      <div class="social-divider"><span>Or Enter Billing Details</span></div>

      <h2 class="section-title">Shipping Address</h2>
      <div class="form-grid">
        <div class="form-group full">
          <label for="fullName">Full Recipient Name</label>
          <input type="text" id="fullName" placeholder="Jane Doe" value="Jane Doe" />
        </div>
        <div class="form-group">
          <label for="emailAddr">Email Confirmation</label>
          <input type="email" id="emailAddr" placeholder="jane@example.com" value="jane@example.com" />
        </div>
        <div class="form-group">
          <label for="phoneNum">Contact Phone</label>
          <input type="text" id="phoneNum" placeholder="+1 (555) 019-2834" />
        </div>
        <div class="form-group full">
          <label for="street">Street Address</label>
          <input type="text" id="street" placeholder="1042 Market Street, Suite 400" />
        </div>
        <div class="form-group">
          <label for="city">City</label>
          <input type="text" id="city" placeholder="San Francisco" />
        </div>
        <div class="form-group">
          <label for="state">State / Region</label>
          <select id="state">
            <option value="CA">California</option>
            <option value="NY">New York</option>
            <option value="TX">Texas</option>
            <option value="WA">Washington</option>
          </select>
        </div>
      </div>

      <h2 class="section-title">Payment Method</h2>
      <div class="form-grid">
        <div class="form-group full">
          <label for="cardNumber">Card Number</label>
          <input type="text" id="cardNumber" placeholder="•••• •••• •••• 4242" />
        </div>
        <div class="form-group">
          <label for="cardExpiry">Expiration Date</label>
          <input type="text" id="cardExpiry" placeholder="MM / YY" />
        </div>
        <div class="form-group">
          <label for="cardCvv">Security Code (CVV)</label>
          <input type="password" id="cardCvv" placeholder="•••" />
        </div>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="saveCard" checked />
        <label for="saveCard">Save this payment method securely for future 1-click purchases</label>
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="termsAgree" checked />
        <label for="termsAgree">I agree to the Terms of Service and Privacy Policy</label>
      </div>

      <div class="actions-bar">
        <button type="button" class="btn btn-secondary" id="btn-back">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Previous Step
        </button>
        <button type="button" class="btn btn-primary" id="btn-submit">
          Continue to Review
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
