    .thumbs { display: flex; gap: 12px; }
    .thumb { width: 72px; height: 72px; background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #64748b; }
    .thumb.active { border-color: #0284c7; background: #e0f2fe; color: #0284c7; }
    .info { display: flex; flex-direction: column; gap: 18px; }
    .badge-category { font-size: 12px; font-weight: 700; text-transform: uppercase; color: #0284c7; letter-spacing: 0.5px; }
    .title { font-size: 26px; font-weight: 800; line-height: 1.25; color: #0f172a; }
    .rating-row { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #475569; }
    .stars { color: #f59e0b; font-weight: bold; }
    .price-box { display: flex; align-items: baseline; gap: 12px; }

    .old-price { font-size: 18px; text-decoration: line-through; color: #94a3b8; }
    .save-pill { background: #dcfce7; color: #15803d; font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 6px; }
    .option-title { font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 8px; }
    .color-swatches { display: flex; gap: 10px; }
    .swatch { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #ffffff; box-shadow: 0 0 0 2px #cbd5e1; cursor: pointer; }
    .swatch.selected { box-shadow: 0 0 0 2px #0284c7; }
    .swatch-black { background: #0f172a; }
    .swatch-silver { background: #94a3b8; }

    .pill-btn.active { border-color: #0284c7; background: #f0f9ff; color: #0284c7; }
    .stepper-row { display: flex; align-items: center; gap: 16px; margin-top: 6px; }
    .stepper { display: inline-flex; border: 1.5px solid #cbd5e1; border-radius: 8px; overflow: hidden; background: #ffffff; }
    .step-btn { width: 36px; height: 38px; border: none; background: #f8fafc; font-size: 16px; font-weight: bold; cursor: pointer; color: #334155; }
    .step-btn:hover { background: #e2e8f0; }
    .qty-input { width: 44px; height: 38px; border: none; text-align: center; font-weight: 600; font-size: 14px; outline: none; }
    .cta-row { display: flex; gap: 12px; margin-top: 12px; }
    .btn-add-cart { flex: 1; height: 48px; background: #0284c7; color: #ffffff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-add-cart:hover { background: #0369a1; }
    .btn-buy-now { flex: 1; height: 48px; background: #0f172a; color: #ffffff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-buy-now:hover { background: #1e293b; }
    .svg-icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

</head>

  <div class="nav">

      </div>

      <div>

          <div class="swatch swatch-black selected" title="Matte Obsidian"></div>

          <div class="swatch swatch-navy" title="Deep Midnight"></div>
        </div>
      </div>

      <div>

        <div class="pill-group">
          <button type="button" class="pill-btn active">Standard Memory Foam</button>
          <button type="button" class="pill-btn">Cooling Gel Pro</button>

      </div>

      <div>

          <span style="font-size: 13px; color: #16a34a; font-weight: 600;">In Stock (Ships Next Business Day)</span>
