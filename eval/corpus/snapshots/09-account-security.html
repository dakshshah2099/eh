<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account Security & Credential Vault</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f3f4f6; margin: 0; padding: 40px; display: flex; justify-content: center; }
    .panel { max-width: 500px; width: 100%; background: #ffffff; border-radius: 8px; border: 1px solid #e5e7eb; padding: 28px; }
    h1 { font-size: 20px; color: #111827; margin: 0 0 16px 0; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
    .btn-update { background: #4f46e5; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Credential & Authentication Policy</h1>
    <form id="securityForm" onsubmit="return false;">
      <div class="form-group">
        <label for="oldMasterPassword">Current Master Password</label>
        <input type="password" id="oldMasterPassword" name="password" value="OldSecurityMasterKey99!" required>
      </div>
      <div class="form-group">
        <label for="newMasterPassword">New Master Passphrase</label>
        <input type="password" id="newMasterPassword" name="password" value="BrandNewSecuredPassphrase#2026" required>
      </div>
      <div class="form-group">
        <label for="backupRecoveryEmail">Backup 2FA Recovery Email</label>
        <input type="email" id="backupRecoveryEmail" name="email" autocomplete="email" value="backup.recovery@securemail.org" required>
      </div>
      <button type="submit" id="btnUpdateSecurity" class="btn-update">Commit Credential Changes</button>
    </form>
  </div>
</body>
</html>
