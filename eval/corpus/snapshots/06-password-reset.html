<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Security Credentials - FinTech Vault</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 40px; display: flex; justify-content: center; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 440px; padding: 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1 { font-size: 20px; font-weight: 700; margin: 0 0 8px 0; color: #f8fafc; }
    p.desc { font-size: 14px; color: #94a3b8; margin: 0 0 24px 0; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 14px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: white; font-size: 14px; }
    .btn-submit { width: 100%; padding: 11px; background: #6366f1; color: white; border: none; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reset Security Credentials</h1>
    <p class="desc">Verify your account email and establish your new secure password.</p>
    <form id="resetForm" onsubmit="return false;">
      <div class="form-group">
        <label for="recoveryEmail">Registered Account Email</label>
        <input type="email" id="recoveryEmail" name="email" autocomplete="email" value="jordan.lee@fintechsecure.com" required>
      </div>
      <div class="form-group">
        <label for="newTempPassword">New Security Password</label>
        <input type="password" id="newTempPassword" name="password" value="NewVaultP@ssword2026!" required>
      </div>
      <div class="form-group">
        <label for="confirmTempPassword">Confirm New Security Password</label>
        <input type="password" id="confirmTempPassword" name="confirm_password" value="NewVaultP@ssword2026!" required>
      </div>
      <button type="submit" id="btnUpdateCredentials" class="btn-submit">Update Account Password</button>
    </form>
  </div>
</body>
</html>
