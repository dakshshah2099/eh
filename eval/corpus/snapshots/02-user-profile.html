<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Profile & Security Settings</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Sarah Jenkins",
    "email": "sarah.jenkins@acmecorp.com"
  }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; margin: 0; padding: 30px; }
    .container { max-width: 680px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 32px; border: 1px solid #e2e8f0; }
    .header { display: flex; align-items: center; gap: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 24px; margin-bottom: 24px; }
    .avatar-wrapper { width: 100px; height: 100px; border-radius: 50%; overflow: hidden; border: 3px solid #3b82f6; flex-shrink: 0; }
    .avatar-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .title-group h1 { margin: 0 0 4px 0; font-size: 24px; color: #0f172a; }
    .title-group p { margin: 0; color: #64748b; font-size: 14px; }
    .form-section { margin-bottom: 24px; }
    .form-section h2 { font-size: 16px; font-weight: 600; color: #1e293b; margin: 0 0 16px 0; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
    input[type="text"], input[type="email"], input[type="password"] { width: 100%; box-sizing: border-box; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    .btn-save { background: #059669; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="avatar-wrapper" id="avatarContainer">
        <img id="profileAvatar" class="avatar-photo" src="../assets/face.svg" data-pii-type="face" alt="Sarah Jenkins Face Avatar" width="100" height="100">
      </div>
      <div class="title-group">
        <h1 id="userHeading" class="profile-name">Sarah Jenkins</h1>
        <p>Senior Infrastructure Security Engineer</p>
      </div>
    </div>
    <form id="profileForm" onsubmit="return false;">
      <div class="form-section">
        <h2>Personal Identity</h2>
        <div class="form-group">
          <label for="fullName">Legal Full Name</label>
          <input type="text" id="fullName" name="full_name" autocomplete="name" value="Sarah Jenkins" required>
        </div>
        <div class="form-group">
          <label for="userEmail">Primary Account Email</label>
          <input type="email" id="userEmail" name="email" autocomplete="email" value="sarah.jenkins@acmecorp.com" required>
        </div>
      </div>
      <div class="form-section">
        <h2>Security & Credentials</h2>
        <div class="form-group">
          <label for="currentPassword">Current Security Password</label>
          <input type="password" id="currentPassword" name="password" value="JenkinsCurrentVault99!" required>
        </div>
      </div>
      <button type="submit" id="btnSaveProfile" class="btn-save">Save Profile Changes</button>
    </form>
  </div>
</body>
</html>
